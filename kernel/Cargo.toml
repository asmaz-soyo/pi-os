[package]
name = "kernel"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
hal = { path = "../hal" }
# TCP/IP スタック(ネットワークの最初の実装。あとで自作の TCP と差し替えて比べる)
smoltcp = { version = "0.14", default-features = false, features = [
    "alloc",
    "medium-ethernet",
    "medium-ip",
    "proto-ipv4",
    "socket-tcp",
    "socket-udp",
    "proto-dhcpv4",
    "socket-dhcpv4",
] }
spin = { version = "0.9", default-features = false, features = ["spin_mutex", "once"] }

[dev-dependencies]
hal = { path = "../hal", features = ["mock"] }
fatimg = { path = "../tools/fatimg" }
