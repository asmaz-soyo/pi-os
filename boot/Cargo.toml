[package]
name = "boot"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
hal = { path = "../hal" }
kernel = { path = "../kernel" }
arch-aarch64 = { path = "../arch/aarch64" }
userland = { path = "../user" }
spin = { version = "0.9", default-features = false, features = ["once"] }

[lib]
test = false
bench = false

[features]
# システムコールを呼ばれるたびに表示する(cargo xtask run --trace syscall)
trace-syscalls = []
# QEMU のセミホスティングで終了する(実機では使えないので外す)
semihosting = []
