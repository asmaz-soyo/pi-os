[package]
name = "bsp-raspi3"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
hal = { path = "../../hal" }
arch-aarch64 = { path = "../../arch/aarch64" }
kernel = { path = "../../kernel" }
boot = { path = "../../boot" }
pl011 = { path = "../../drivers/pl011" }
bcm2836-local-intc = { path = "../../drivers/bcm2836-local-intc" }

[features]
# QEMU で使うビルドではセミホスティングで終了する。実機用は --no-default-features で外す
default = ["semihosting"]
semihosting = ["boot/semihosting"]
# 起動後にわざとパニックする(パニックの報告のスナップショットテスト用)
panic-demo = []
# 起動後にわざと未定義命令を実行する(未処理の例外の報告のスナップショットテスト用)
fault-demo = []
# システムコールのトレース
trace-syscalls = ["boot/trace-syscalls"]

[dev-dependencies]
ktest = { path = "../../ktest" }

[[bin]]
name = "bsp-raspi3"
test = true
bench = false
