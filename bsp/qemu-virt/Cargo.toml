[package]
name = "bsp-qemu-virt"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
hal = { path = "../../hal" }
arch-aarch64 = { path = "../../arch/aarch64" }
kernel = { path = "../../kernel" }
boot = { path = "../../boot" }
pl011 = { path = "../../drivers/pl011" }
gicv2 = { path = "../../drivers/gicv2" }

[features]
# 起動後にわざとパニックする(パニックの報告のスナップショットテスト用)
panic-demo = []
# 起動後にわざと未定義命令を実行する(未処理の例外の報告のスナップショットテスト用)
fault-demo = []
# システムコールのトレース
trace-syscalls = ["boot/trace-syscalls"]

[dev-dependencies]
ktest = { path = "../../ktest" }

[[bin]]
name = "bsp-qemu-virt"
test = true
bench = false
