[workspace]
resolver = "3"
members = ["hal", "kernel", "drivers/pl011", "drivers/gicv2", "drivers/bcm2836-local-intc", "drivers/virtio-mmio", "drivers/virtio-blk", "drivers/virtio-net", "drivers/pl061", "xtask", "arch/aarch64", "user", "boot", "ktest", "bsp/qemu-virt", "bsp/raspi3", "tools/fatimg", "user/rust/svcman"]
default-members = [
    "hal",
    "kernel",
    "drivers/pl011",
    "drivers/gicv2",
    "drivers/bcm2836-local-intc",
    "drivers/virtio-mmio",
    "drivers/virtio-blk",
    "drivers/virtio-net",
    "drivers/pl061",
    "xtask",
    "tools/fatimg",
    "user/rust/svcman",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

# smoltcp は最適化してビルドする(自分たちのコードはデバッグしやすいまま)。最適化なしだと
# QEMU の上で 1 回の poll に数 ms かかり、その間リアルタイムのタスクが待たされた
[profile.dev.package.smoltcp]
opt-level = 2
